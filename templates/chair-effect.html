<title>The Chair Effect</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@800&display=swap">
<style>
/* Layout: one 9:16 vertical film frame centered on an ink ground, transport controls beneath it */
:root{
  --ink:#0c0f15; --frame:#05070b; --paper:#eef0f2; --dim:#98a1b0; --chair:#e5483d; --rule:#2a303c;
  --serif:"Newsreader","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--ink);color:var(--paper);box-sizing:border-box;font-family:var(--mono);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.player{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.viewport{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.stage{position:relative;overflow:hidden;border-radius:8px;background:var(--frame);container-type:size;width:270px;height:480px}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block}
.shade{position:absolute;inset:0 0 auto;height:48%;background:linear-gradient(rgba(5,7,11,.42),rgba(5,7,11,0));pointer-events:none}
.headline{
  position:absolute;top:5.5%;left:8%;right:8%;margin:0;text-align:center;
  font-family:var(--serif);font-weight:400;font-size:6.2cqw;line-height:1.16;text-wrap:balance;
  text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.35);
}
.headline em{font-style:normal;color:var(--chair)}
.stat{position:absolute;left:6%;top:21%;max-width:72%;display:flex;flex-direction:column;gap:.35cqw;text-shadow:0 1px 2px rgba(0,0,0,.6),0 0 14px rgba(0,0,0,.35)}
.stat .lab{font-size:2.3cqw;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.stat .val{font-family:var(--serif);font-size:10.5cqw;line-height:1.02;font-variant-numeric:tabular-nums}
.stat .sub{font-size:2.3cqw;letter-spacing:.1em;text-transform:uppercase}
.stat .note{font-size:1.8cqw;letter-spacing:.12em;text-transform:uppercase;opacity:.62;margin-top:.6cqw}
.tag{
  position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;
  font-size:2.1cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(10,12,18,.78);color:var(--paper);padding:.55em .85em;border-radius:3px;
}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:3.2cqw;background:currentColor;opacity:.7}
.tag.red{background:var(--chair)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.card{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3cqw;
  padding:0 10%;text-align:center;font-family:var(--serif);font-size:6.6cqw;line-height:1.2;text-wrap:balance;
  background:rgba(7,9,14,0);pointer-events:none;
}
.card p{margin:0;opacity:0}
.card .red{color:var(--chair);font-weight:500;font-size:7.6cqw}
.controls{display:flex;align-items:center;gap:10px;width:270px;max-width:100%}
.controls button{
  flex:none;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);
  background:transparent;border:1px solid var(--rule);border-radius:4px;padding:8px 10px;cursor:pointer;min-width:0
}
.controls button:hover{border-color:var(--dim)}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--chair);outline-offset:2px}
.controls input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--chair)}
.soundhint{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);white-space:nowrap;font:500 2.6cqw/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:rgba(10,12,18,.78);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:1em 1.5em;cursor:pointer}
.caption{
  position:absolute;left:6%;right:6%;bottom:15%;text-align:center;pointer-events:none;
  font-family:"Archivo","Arial Black",system-ui,sans-serif;font-weight:800;font-size:6.6cqw;line-height:1.15;color:#fff;
  -webkit-text-stroke:1.1cqw #07090e;paint-order:stroke fill;text-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.45);
}
.caption .on{color:var(--chair)}
.soundhint:focus-visible{outline:2px solid var(--chair);outline-offset:2px}
.clock{flex:none;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
</style>

<div class="player">
  <div class="viewport" id="viewport">
    <div class="stage" id="stage" role="img" aria-label="Animated story: going back 100 years and moving one chair changes who meets whom, until everyone alive today is different, including you.">
      <div class="loading" id="loading">Loading scene</div>
      <div class="shade"></div>
      <h1 class="headline" id="headline">What if you went back in time and moved a single <em>chair</em>?</h1>
      <div class="stat" id="stat">
        <div class="lab" id="lab"></div>
        <div class="val" id="val"></div>
        <div class="sub" id="sub"></div>
        <div class="note">Thought experiment · the butterfly effect</div>
      </div>
      <div class="tag" id="tagGhost" hidden>Original timeline</div>
      <div class="tag" id="tagGran" hidden>Your great-grandmother</div>
      <div class="tag red" id="tagYou" hidden>You</div>
      <div class="caption" id="caption" aria-live="off"></div>
      <div class="flash" id="flash"></div>
      <div class="card" id="card">
        <p id="c1">One chair. Thirty centimeters.</p>
        <p id="c2">A hundred years later, almost everyone is someone else.</p>
        <p id="c3" class="red">Would you still be here?</p>
      </div>
      <button class="soundhint" id="hint" type="button">Turn on sound</button>
    </div>
  </div>
  <div class="controls" id="controls">
    <button id="play" type="button">Pause</button>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
    <input id="scrub" type="range" min="0" max="58" step="0.01" value="0" aria-label="Timeline position">
    <span class="clock" id="clock">0:00 / 0:58</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const DUR=58, SX=300, TZ=-400;
const $=id=>document.getElementById(id);
const clamp01=x=>x<0?0:x>1?1:x;
const lerp=(a,b,k)=>a+(b-a)*k;
const sm=x=>{x=clamp01(x);return x*x*(3-2*x)};
function rngFrom(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng=rngFrom(7);

/* ---------- renderer ---------- */
const stage=$('stage'), viewport=$('viewport'), controls=$('controls');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.insertBefore(renderer.domElement,stage.firstChild);
$('loading').remove();

const scene=new THREE.Scene();
scene.background=new THREE.Color('#d9c39f');
scene.fog=new THREE.Fog('#d9c39f',12,40);
const camera=new THREE.PerspectiveCamera(60,9/16,0.1,1200);
const hemi=new THREE.HemisphereLight('#fff1d6','#6b5236',0.85); scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffd9a0',0.9);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);

/* ---------- helpers ---------- */
const BOXG=new THREE.BoxGeometry(1,1,1);
const GHOST=new THREE.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:0.34,depthWrite:false});
const lamCache={};
const lam=c=>lamCache[c]||(lamCache[c]=new THREE.MeshLambertMaterial({color:c}));
function box(w,h,d,m,x,y,z,parent){
  const mesh=new THREE.Mesh(BOXG,m); mesh.scale.set(w,h,d); mesh.position.set(x,y,z);
  mesh.castShadow=m!==GHOST; mesh.receiveShadow=m!==GHOST; parent.add(mesh); return mesh;
}
function makePerson(c,ghost){
  const M=col=>ghost?GHOST:lam(col);
  const g=new THREE.Group();
  const legL=new THREE.Group(), legR=new THREE.Group(), armL=new THREE.Group(), armR=new THREE.Group();
  legL.position.set(-0.11,0.9,0); legR.position.set(0.11,0.9,0);
  box(0.17,0.9,0.19,M(c.pants),0,-0.45,0,legL); box(0.17,0.9,0.19,M(c.pants),0,-0.45,0,legR);
  box(0.19,0.08,0.28,M(c.shoes||'#2a2420'),0,-0.86,0.04,legL); box(0.19,0.08,0.28,M(c.shoes||'#2a2420'),0,-0.86,0.04,legR);
  g.add(legL,legR);
  box(0.46,0.62,0.27,M(c.shirt),0,1.21,0,g);
  if(c.dress) box(0.5,0.5,0.34,M(c.shirt),0,0.74,0,g);
  armL.position.set(-0.31,1.48,0); armR.position.set(0.31,1.48,0);
  box(0.14,0.6,0.16,M(c.shirt),0,-0.3,0,armL); box(0.14,0.6,0.16,M(c.shirt),0,-0.3,0,armR);
  box(0.12,0.1,0.13,M(c.skin),0,-0.64,0,armL); box(0.12,0.1,0.13,M(c.skin),0,-0.64,0,armR);
  g.add(armL,armR);
  box(0.3,0.32,0.3,M(c.skin),0,1.7,0,g);
  box(0.32,0.1,0.32,M(c.hair),0,1.89,0,g);
  box(0.32,0.22,0.08,M(c.hair),0,1.77,-0.13,g);
  if(c.hat){box(0.44,0.04,0.44,M(c.hat),0,1.93,0,g);box(0.31,0.16,0.31,M(c.hat),0,2.02,0,g)}
  return {g,legL,legR,armL,armR};
}
function resetPose(p){p.g.rotation.set(0,0,0);p.g.position.y=0;[p.legL,p.legR,p.armL,p.armR].forEach(o=>o.rotation.set(0,0,0))}
function walk(p,phase,amt){const s=Math.sin(phase)*0.55*amt;p.legL.rotation.x=s;p.legR.rotation.x=-s;p.armL.rotation.x=-s*0.9;p.armR.rotation.x=s*0.9}
function pathAt(pts,t0,t1,t){
  const seg=[];let L=0;
  for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);L+=l}
  const k=clamp01((t-t0)/(t1-t0)); const d=k*L; let acc=d;
  for(let i=0;i<seg.length;i++){
    if(acc<=seg[i]||i===seg.length-1){
      const f=seg[i]?Math.min(1,acc/seg[i]):0, a=pts[i], b=pts[i+1];
      return {x:lerp(a[0],b[0],f),z:lerp(a[1],b[1],f),h:Math.atan2(b[0]-a[0],b[1]-a[1]),d,moving:k>0&&k<1};
    }
    acc-=seg[i];
  }
}
function onPath(p,pts,t0,t1,t){const r=pathAt(pts,t0,t1,t);p.g.position.set(r.x,0,r.z);p.g.rotation.y=r.h;walk(p,r.d*3.4,r.moving?1:0);return r}
function makeChair(m){
  const g=new THREE.Group();
  box(0.5,0.06,0.5,m,0,0.45,0,g);
  [[-0.21,-0.21],[0.21,-0.21],[-0.21,0.21],[0.21,0.21]].forEach(([x,z])=>box(0.05,0.45,0.05,m,x,0.225,z,g));
  box(0.05,0.6,0.05,m,-0.21,0.78,-0.22,g); box(0.05,0.6,0.05,m,0.21,0.78,-0.22,g);
  box(0.5,0.18,0.04,m,0,0.98,-0.22,g); box(0.5,0.06,0.04,m,0,0.72,-0.22,g);
  return g;
}

/* ---------- the room (1925 parlour that becomes a 2025 living room) ---------- */
const room=new THREE.Group(); scene.add(room);
const ROOMC={wall:['#b98f62','#d6dade'],floor:['#6e4527','#b48a5e'],rug:['#7e2f28','#4f6585'],trim:['#4a2f1d','#f0f0ee'],door:['#3b2516','#7d6048'],win:['#ffe9b8','#d4ebff']};
const RM={}; for(const k in ROOMC) RM[k]=k==='win'?new THREE.MeshBasicMaterial({color:ROOMC[k][0]}):new THREE.MeshLambertMaterial({color:ROOMC[k][0]});
box(8,0.1,8,RM.floor,0,-0.05,0,room);
box(8,3.2,0.2,RM.wall,0,1.6,-4,room);
box(0.2,3.2,8,RM.wall,-4,1.6,0,room);
box(8,0.14,0.24,RM.trim,0,0.07,-3.88,room); box(0.24,0.14,8,RM.trim,-3.88,0.07,0,room);
box(0.06,2.1,1,RM.door,-3.88,1.05,1.1,room);
box(1,2.1,0.06,RM.door,2.5,1.05,-3.88,room);
box(1.5,1.3,0.06,RM.win,-1.4,1.75,-3.88,room);
box(1.62,0.08,0.1,RM.trim,-1.4,1.06,-3.84,room);
box(3.2,0.02,2.2,RM.rug,-0.6,0.01,0.6,room);
const picture=box(0.8,0.6,0.05,lam('#2f3a3f'),1.1,1.9,-3.86,room);
const lamp=new THREE.Group(); room.add(lamp); lamp.position.set(3.2,0,-3.2);
box(0.08,1.6,0.08,lam('#2b2b2b'),0,0.8,0,lamp); box(0.5,0.35,0.5,lam('#efe2c4'),0,1.75,0,lamp); box(0.4,0.05,0.4,lam('#2b2b2b'),0,0.02,0,lamp);
const table=new THREE.Group(); room.add(table); table.position.set(1.6,0,-2.3);
box(1.6,0.08,0.9,lam('#5a3a22'),0,0.76,0,table);
[[-0.7,-0.36],[0.7,-0.36],[-0.7,0.36],[0.7,0.36]].forEach(([x,z])=>box(0.08,0.72,0.08,lam('#5a3a22'),x,0.36,z,table));
box(0.2,0.25,0.2,lam('#d9d2c0'),0.3,0.92,0,table);
const sofa=new THREE.Group(); room.add(sofa); sofa.position.set(1.4,0,-3.1);
box(2.4,0.45,0.95,lam('#4d6b80'),0,0.25,0,sofa); box(2.4,0.65,0.25,lam('#4d6b80'),0,0.72,-0.36,sofa);
box(0.22,0.65,0.95,lam('#42607a'),-1.2,0.4,0,sofa); box(0.22,0.65,0.95,lam('#42607a'),1.2,0.4,0,sofa);
const tv=box(1.4,0.8,0.06,lam('#15181d'),-2.6,1.4,-3.86,room);
const chairMat=lam('#8a5a35');
const chair=makeChair(chairMat); room.add(chair);
const ghostChair=makeChair(GHOST); room.add(ghostChair); ghostChair.position.set(-0.8,0,0.6);

/* ---------- 1925 street with a tram ---------- */
const street=new THREE.Group(); scene.add(street);
box(240,0.1,80,lam('#b9a88a'),SX,-0.06,0,street);
box(240,0.05,7,lam('#4d4640'),SX,0.01,1.5,street);
box(240,0.04,0.12,lam('#8f8a84'),SX,0.05,0.5,street); box(240,0.04,0.12,lam('#8f8a84'),SX,0.05,1.7,street);
box(240,0.16,5,lam('#c4b59a'),SX,0.08,-4.5,street);
const brick=['#8c4a36','#a35d42','#7a5a48','#b08a68','#6f4a3a','#9c7b5c','#c2a27a'];
const winMat=lam('#3c4450'), doorMat=lam('#3a2618');
for(let x=-70;x<70;){
  const w=6+Math.floor(rng()*4), h=6+rng()*8, col=brick[Math.floor(rng()*brick.length)];
  box(w-0.3,h,6,lam(col),SX+x+w/2,h/2,-10,street);
  box(w-0.1,0.4,6.3,lam('#3f3330'),SX+x+w/2,h+0.2,-10,street);
  const floors=Math.floor(h/3);
  for(let f=0;f<floors;f++) for(let cx=x+1.4;cx<x+w-1;cx+=2.2){
    if(f===0&&Math.abs(cx-x-w/2)<1.2) continue;
    box(0.9,1.3,0.08,winMat,SX+cx+0.4,1.8+f*3,-6.98,street);
  }
  box(1.1,2.2,0.08,doorMat,SX+x+w/2,1.1,-6.98,street);
  x+=w;
}
box(1.2,2.2,0.1,lam('#2a1a10'),SX-2,1.1,-6.96,street);
for(let x=-60;x<=60;x+=14){const l=new THREE.Group();street.add(l);l.position.set(SX+x,0,-2.4);box(0.12,4,0.12,lam('#2c2c2c'),0,2,0,l);box(0.4,0.3,0.4,lam('#fff1c8'),0,4,0,l)}
const stop=new THREE.Group(); street.add(stop); stop.position.set(SX+4.6,0,-3);
box(0.1,2.8,0.1,lam('#2c3a33'),0,1.4,0,stop); box(0.7,0.45,0.06,lam('#d9cfa8'),0,2.6,0,stop);
box(1.8,0.08,0.5,lam('#5a3a22'),-1,0.45,-0.6,stop); box(0.08,0.45,0.4,lam('#2c2c2c'),-1.8,0.22,-0.6,stop); box(0.08,0.45,0.4,lam('#2c2c2c'),-0.2,0.22,-0.6,stop);
const tram=new THREE.Group(); scene.add(tram);
box(11,2.2,2.4,lam('#e6d8b8'),0,1.9,0,tram); box(11.05,0.8,2.45,lam('#2f5d4a'),0,0.75,0,tram);
box(10.6,0.25,2.2,lam('#3a3a3a'),0,3.1,0,tram); box(0.08,0.9,0.08,lam('#222'),0,3.6,0,tram); box(1.4,0.06,0.08,lam('#222'),0,4.05,0,tram);
for(let i=-4;i<=4;i++){ if(i===0) continue; box(0.9,0.8,2.46,lam('#46505c'),i*1.15,2.2,0,tram) }
box(0.9,1.8,2.46,lam('#2a2f36'),0,1.5,0,tram);
for(const x of [-3.8,3.8]){box(1.2,0.5,2.2,lam('#2a2a2a'),x,0.3,0,tram)}

/* ---------- people ---------- */
const you=makePerson({shirt:'#d6453d',pants:'#34507e',skin:'#e0b48e',hair:'#2b1d14',shoes:'#f0f0f0'}); scene.add(you.g);
const man=makePerson({shirt:'#5b4632',pants:'#3a3029',skin:'#e3bd98',hair:'#3a2a1c',hat:'#2b2520'}); scene.add(man.g);
const ghostMan=makePerson({hat:'#fff'},true); scene.add(ghostMan.g);
const gran=makePerson({shirt:'#6b2f45',pants:'#6b2f45',skin:'#efc9a8',hair:'#5a3a24',dress:true,hat:'#3d2633'}); scene.add(gran.g);
const ghostBeau=makePerson({hat:'#fff'},true); scene.add(ghostBeau.g);
const sitA=makePerson({shirt:'#2f8f85',pants:'#2e3440',skin:'#c99674',hair:'#1c1c1c'}); scene.add(sitA.g);
const sitB=makePerson({shirt:'#e0a63a',pants:'#5a4d7a',skin:'#f1cfb0',hair:'#7a4a2a'}); scene.add(sitB.g);

/* ---------- the town, 1925 to 2025 ---------- */
const town=new THREE.Group(); town.position.set(0,0,TZ); scene.add(town);
const ground=box(300,0.1,300,new THREE.MeshLambertMaterial({color:'#8a9563'}),0,-0.06,0,town);
for(let k=0;k<=12;k++){const p=(k-6)*22;box(5,0.05,270,lam('#3e3e44'),p,0.01,0,town);box(270,0.05,5,lam('#3e3e44'),0,0.012,p,town)}
const OLDB=['#cbb994','#b9a57e','#d8ccb0','#a89878','#c2b28c','#9f9a84','#d4c4a0'];
const NEWB=['#8fa4b8','#c9d1d8','#6f8499','#b3c2cf','#e2e5e8','#5d7186','#a9b6a6','#d9cbb4'];
const blds=[];
for(let i=0;i<12;i++)for(let j=0;j<12;j++)for(let a=0;a<2;a++)for(let b=0;b<2;b++){
  const x=(i-5.5)*22+(a-0.5)*8.5, z=(j-5.5)*22+(b-0.5)*8.5, d=Math.hypot(x,z);
  blds.push({x,z,d,w:4.8+rng()*1.9,h0:2.6+rng()*3.6,h1:6+rng()*10+75*Math.exp(-d/55)*rng(),
    c0:new THREE.Color(OLDB[Math.floor(rng()*OLDB.length)]),c1:new THREE.Color(NEWB[Math.floor(rng()*NEWB.length)]),
    born:d<55?0:30.6+5.4*((d-55)/135)+rng()*0.5});
}
const bGeo=new THREE.BoxGeometry(1,1,1); bGeo.translate(0,0.5,0);

/* ---------- per-frame state, a pure function of t ---------- */
const MAN_ROOM=[[-3.9,1.1],[2.5,1.1],[2.5,-3.7]];
const vMan=11.2/5.3, BUMP=12.3+2.45/vMan;
function update(t){
  let si=SC.findIndex(s=>t>=s.t0&&t<s.t1); if(si<0) si=SC.length-1;
  const s=SC[si], k=(t-s.t0)/(s.t1-s.t0);
  room.visible=[0,1,2,7].includes(si);
  street.visible=tram.visible=si===3||si===4;
  town.visible=si===5||si===6||si===8;

  // light, sky, camera
  if(si===0) applyEnv(ENV.modern,ENV.old,sm((t-1.6)/1.2),12,40);
  else if(si<=2) applyEnv(ENV.old,ENV.old,0,12,40);
  else if(si<=4) applyEnv(ENV.old,ENV.old,0,25,120);
  else if(si===5) applyEnv(ENV.old,ENV.modern,sm((t-31)/6),140,560);
  else if(si===6) applyEnv(ENV.modern,ENV.dusk,sm((t-40)/5),140,560);
  else if(si===7) applyEnv(ENV.modern,ENV.dusk,0.3,12,40);
  else applyEnv(ENV.dusk,ENV.night,sm((t-51)/4),160,620);

  if(si===3){
    if(t<21) setShot([SX+3,3.4,8],[SX+4,3.0,6.6],[SX,1.9,-4],[SX+3,1.9,-3],(t-18)/3);
    else setShot([SX+11,2.6,-5.6],[SX+10,2.4,-5.2],[SX+3.6,1.9,-1.2],[SX+4.4,1.9,-0.6],(t-21)/3);
  } else if(si===5){
    const e=sm(k), a=0.6+0.55*e, r=150+70*e;
    camera.position.set(r*Math.sin(a),105+70*e,TZ+r*Math.cos(a)); camera.lookAt(0,0,TZ);
  } else { const sh=SHOTS[si]; setShot(sh[0],sh[1],sh[2],sh[3],k) }

  const inTown=town.visible;
  sun.castShadow=!inTown;
  const off=inTown?new THREE.Vector3(90,150,70):new THREE.Vector3(6,12,5);
  sun.target.position.copy(look); sun.position.copy(look).add(off);
  const ext=si>=3&&si<=4?26:9;
  sun.shadow.camera.left=sun.shadow.camera.bottom=-ext; sun.shadow.camera.right=sun.shadow.camera.top=ext;
  sun.shadow.camera.near=0.5; sun.shadow.camera.far=60; sun.shadow.camera.updateProjectionMatrix();

  // the room's era: 2025 at the start and near the end, 1925 in between
  const era=si===0?1-sm((t-1.6)/1.2):si===7?1:0;
  for(const key in ROOMC) RM[key].color.set(ROOMC[key][0]).lerp(cB.set(ROOMC[key][1]),era);
  table.visible=era<0.5; sofa.visible=tv.visible=era>=0.5; picture.visible=era<0.5;
  chair.position.set(-0.8,0,t<7.5?0.6:lerp(0.6,0.3,sm((t-7.5)/2)));
  chair.rotation.y=0;
  ghostChair.visible=(si===1&&t>7.6)||si===2;
  ghostChair.rotation.y=si===2&&t>BUMP?0.28*sm((t-BUMP)/0.25):0;
  ghostChair.position.z=0.6-(si===2&&t>BUMP?0.12*sm((t-BUMP)/0.25):0);

  // you
  [you,man,ghostMan,gran,ghostBeau,sitA,sitB].forEach(resetPose);
  you.g.visible=false;
  if(si===0){you.g.visible=burstState(BURSTS[0],t)==='shown';you.g.position.set(0.6,0,1.6);you.g.rotation.y=-Math.PI/2}
  else if(si===1){
    you.g.visible=burstState(BURSTS[1],t)==='shown';
    if(t<7.5) onPath(you,[[0.6,1.6],[-0.8,1.38]],6.2,7.4,t);
    else{
      you.g.rotation.y=Math.PI;
      const push=sm((t-7.5)/2), back=sm((t-9.7)/0.7);
      you.g.position.set(-0.8,0,1.38-0.3*push+0.5*back);
      const arms=t<9.6?-1.25:-1.25*(1-sm((t-9.6)/0.4));
      you.armL.rotation.x=you.armR.rotation.x=arms;
      if(t>7.5&&t<9.5){const s=Math.sin((t-7.5)*7)*0.25;you.legL.rotation.x=s;you.legR.rotation.x=-s}
      if(t>9.7&&t<10.4){const s=Math.sin((t-9.7)*12)*0.35;you.legL.rotation.x=s;you.legR.rotation.x=-s}
    }
  } else if(si===7){
    you.g.visible=burstState(BURSTS[3],t)==='shown'; you.g.position.set(0.4,0,1.0); you.g.rotation.y=0.55;
    if(t>46.6) you.g.rotation.y=0.55-0.9*sm((t-46.6)/0.8);
  }

  // the stranger, his tram, the meeting that never happens
  man.g.visible=false; ghostMan.g.visible=false; gran.g.visible=false; ghostBeau.g.visible=false;
  if(si===2){
    man.g.visible=t>=12.3&&t<17.6; onPath(man,MAN_ROOM,12.3,17.6,t);
    ghostMan.g.visible=true;
    if(t<BUMP) onPath(ghostMan,[[-3.9,1.1],[-1.45,1.1]],12.3,BUMP,t);
    else{ghostMan.g.position.set(-1.45,0,1.1);ghostMan.g.rotation.y=Math.PI/2;const f=sm((t-BUMP)/0.3);ghostMan.g.rotation.x=0.38*f;ghostMan.legR.rotation.x=-0.6*f;ghostMan.armL.rotation.x=-1.0*f;ghostMan.armR.rotation.x=-0.7*f}
  }
  let tx=-200;
  if(si===3||si===4){
    if(t<21) tx=-70+72*(1-Math.pow(1-clamp01((t-18)/3),2));
    else if(t<22.6) tx=2;
    else tx=2+60*Math.pow((t-22.6)/2.4,2);
  }
  tram.position.set(SX+tx+2.6,0,1.1);
  if(si===3){
    man.g.visible=t<22.1;
    if(t<20.7) onPath(man,[[SX-2,-6.6],[SX-2,-4.2],[SX+3.8,-2.6]],18.1,20.7,t);
    else if(t<21.6){man.g.position.set(SX+3.8,0,-2.6);man.g.rotation.y=0}
    else onPath(man,[[SX+3.8,-2.6],[SX+4.6,0.2]],21.6,22.1,t);
  }
  if(si===4){
    gran.g.visible=true; gran.g.position.set(SX+3.4,0,-2.9); gran.g.rotation.y=-0.5;
    ghostBeau.g.visible=burstState(BURSTS[2],t)==='shown'; ghostBeau.g.position.set(SX+2.5,0,-2.9); ghostBeau.g.rotation.y=Math.PI/2;
    ghostBeau.armR.rotation.x=-0.5*Math.max(0,Math.sin((t-24)*2.2));
  }
  sitA.g.visible=sitB.g.visible=si===7;
  if(si===7){
    for(const [p,x] of [[sitA,0.8],[sitB,2.0]]){p.g.position.set(x,-0.38,-3.0);p.legL.rotation.x=p.legR.rotation.x=-Math.PI/2;p.armL.rotation.x=p.armR.rotation.x=-0.5}
    sitA.g.rotation.y=0.25; sitB.g.rotation.y=-0.2;
  }

  // town growth and the ripple
  if(inTown){
    const growK=si===6?sm((t-38.6)/3.6):si===8?1:0;
    blds.forEach((b,i)=>{
      const born=si===5?sm((t-b.born)/0.5):1;
      const h=lerp(b.h0,b.h1,growK)*born;
      dummy.position.set(b.x,0,b.z); dummy.scale.set(b.w*born+0.0001,h+0.0001,b.w*born+0.0001); dummy.rotation.set(0,0,0); dummy.updateMatrix();
      bMesh.setMatrixAt(i,dummy.matrix); tmpC.copy(b.c0).lerp(b.c1,growK); bMesh.setColorAt(i,tmpC);
    });
    bMesh.instanceMatrix.needsUpdate=true; bMesh.instanceColor.needsUpdate=true;
    ground.material.color.set('#8a9563').lerp(cB.set('#6e7a6c'),si===5?sm((t-31)/6):1);
    const wave=si===5?2+200*Math.pow(livesK(t),1.5):1e9;
    crowd.forEach((c,i)=>{
      let s=((c.s+c.v*t)%264+264)%264-132;
      const x=c.horiz?s:c.line, z=c.horiz?c.line:s;
      dummy.position.set(x,1.2,z); dummy.scale.set(1.4,2.4,1.4); dummy.updateMatrix(); pMesh.setMatrixAt(i,dummy.matrix);
      if(Math.hypot(x,z)<wave) tmpC.copy(RED).offsetHSL(0,0,(c.hue-0.5)*0.18); else tmpC.copy(CREAM);
      pMesh.setColorAt(i,tmpC);
    });
    pMesh.instanceMatrix.needsUpdate=true; pMesh.instanceColor.needsUpdate=true;
    ring.visible=si===5; ring.scale.setScalar(Math.max(0.01,si===5?2+200*Math.pow(livesK(t),1.5):1));
    ring.material.opacity=0.65*(1-0.6*livesK(t));
    beacon.visible=si===5; beacon.scale.setScalar(1+0.25*Math.sin(t*6));
  }

  // dissolve cubes
  let slot=0;
  BURSTS.forEach(b=>{
    const active=t>=b.t0&&t<=b.t0+b.dur;
    for(let j=0;j<PER;j++,slot++){
      if(!active){dummy.scale.setScalar(0.00001);dummy.position.set(0,-50,0);dummy.updateMatrix();partMesh.setMatrixAt(slot,dummy.matrix);continue}
      const sd=seeds[slot]; let p=(t-b.t0)/b.dur; if(b.mode==='in') p=1-p;
      const e=1-Math.pow(1-p,2);
      dummy.position.set(b.at[0]+sd[0]*0.5+sd[0]*e*2.6,b.at[1]+sd[1]*1.7+e*(1.2+sd[3]*1.6),b.at[2]+sd[2]*0.35+sd[2]*e*2.6);
      dummy.rotation.set(e*4*sd[0],e*4*sd[1],0);
      dummy.scale.setScalar(Math.max(0.00001,(0.07+0.06*sd[3])*(1-p*0.85)));
      dummy.updateMatrix(); partMesh.setMatrixAt(slot,dummy.matrix);
    }
  });
  partMesh.instanceMatrix.needsUpdate=true;

  return {si,s};
}

const lab=$('lab'), val=$('val'), sub=$('sub'), statEl=$('stat'), headline=$('headline'), flash=$('flash'), card=$('card');
const C=[[$('c1'),51.6],[$('c2'),53.0],[$('c3'),55.0]];

  {el:$('tagGhost'),obj:ghostMan.g,y:2.55,on:t=>t>12.6&&t<17.6},
  {el:$('tagGran'),obj:gran.g,y:2.45,on:t=>t>24.4&&t<29.8},

const pv=new THREE.Vector3();
let W=270,H=480;

function overlay(t,si,s){
  if(s.card){statEl.style.opacity=0}
  else{
    setText(lab,s.lab);
    setText(val,typeof s.val==='function'?s.val(t):s.val);
    setText(sub,typeof s.sub==='function'?s.sub(t):s.sub);
    statEl.style.opacity=sm((t-s.t0)/0.35)*(1-sm((t-(s.t1-0.25))/0.25));
  }

  card.style.background='rgba(7,9,14,'+(0.72*sm((t-51)/1.2)).toFixed(3)+')';
  C.forEach(([el,t0])=>el.style.opacity=sm((t-t0)/0.7));
  TAGS.forEach(g=>{
    const on=g.on(t)&&g.obj.visible;
    g.el.hidden=!on; if(!on) return;
    pv.copy(g.obj.position); pv.y+=g.y; pv.project(camera);
    if(pv.z>1){g.el.hidden=true;return}
    const x=(pv.x*0.5+0.5)*W, y=(-pv.y*0.5+0.5)*H;

  });
}

/* ---------- sound: everything is synthesized live with Web Audio ---------- */
const AU={on:false,ctx:null,lastT:null,lastSi:-1};
const midiF=m=>440*Math.pow(2,(m-69)/12);
const CHORDS=[[38,45,53,64],[38,45,53,57],[34,41,50,57],[41,48,57,60],[43,50,58,62],[45,52,57,64],[38,50,57,66],[34,46,53,57],[26,38,45,53]];
function loopNoise(type,freq,q){
  const c=AU.ctx, s=c.createBufferSource(); s.buffer=AU.noise; s.loop=true;
  const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain(); g.gain.value=0; s.connect(f); f.connect(g); g.connect(AU.master); g.connect(AU.rev); s.start();
  return {f,g};
}
function initAudio(){
  const c=new (window.AudioContext||window.webkitAudioContext)(); AU.ctx=c;
  AU.master=c.createGain(); AU.master.gain.value=0;
  const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  AU.master.connect(comp); comp.connect(c.destination);
  const len=Math.floor(c.sampleRate*2.6), ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
  AU.rev=c.createConvolver(); AU.rev.buffer=ir;
  const wet=c.createGain(); wet.gain.value=0.32; AU.rev.connect(wet); wet.connect(AU.master);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate), nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  AU.noise=nb;
  AU.padF=c.createBiquadFilter(); AU.padF.type='lowpass'; AU.padF.frequency.value=700; AU.padF.Q.value=0.7;
  AU.padG=c.createGain(); AU.padG.gain.value=0; AU.padF.connect(AU.padG); AU.padG.connect(AU.master); AU.padG.connect(AU.rev);
  AU.voices=CHORDS[0].map((m,i)=>[-7,7].map(cents=>{
    const o=c.createOscillator(); o.type=i===0?'triangle':'sawtooth'; o.frequency.value=midiF(m); o.detune.value=cents;
    const g=c.createGain(); g.gain.value=i===0?0.5:0.14; o.connect(g); g.connect(AU.padF); o.start(); return o;
  }));
  AU.rumble=loopNoise('lowpass',110,0.8);
  AU.wind=loopNoise('bandpass',500,0.6);
  AU.riser=loopNoise('bandpass',300,5);
  AU.riserOsc=c.createOscillator(); AU.riserOsc.type='sawtooth';
  AU.riserOscG=c.createGain(); AU.riserOscG.gain.value=0; AU.riserOsc.connect(AU.riserOscG); AU.riserOscG.connect(AU.master); AU.riserOscG.connect(AU.rev); AU.riserOsc.start();
}
function env(g,t0,a,peak,dur){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur)}
function tone(freq,dur,o={}){
  const c=AU.ctx, t0=c.currentTime+(o.delay||0);
  const osc=c.createOscillator(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(freq,t0);
  if(o.glide) osc.frequency.exponentialRampToValueAtTime(o.glide,t0+dur);
  const g=c.createGain(); env(g,t0,o.attack||0.005,o.gain||0.2,dur);
  osc.connect(g); g.connect(AU.master); if(o.wet!==false) g.connect(AU.rev);
  osc.start(t0); osc.stop(t0+dur+0.05);
}
function noise(dur,o={}){
  const c=AU.ctx, t0=c.currentTime+(o.delay||0);
  const s=c.createBufferSource(); s.buffer=AU.noise;
  const f=c.createBiquadFilter(); f.type=o.type||'bandpass'; f.Q.value=o.q||1; f.frequency.setValueAtTime(o.f0||1000,t0);
  if(o.f1) f.frequency.exponentialRampToValueAtTime(o.f1,t0+dur);
  const g=c.createGain(); env(g,t0,o.attack||0.005,o.gain||0.2,dur);
  s.connect(f); f.connect(g); g.connect(AU.master); if(o.wet!==false) g.connect(AU.rev);
  s.start(t0); s.stop(t0+dur+0.05);
}

const EV=[[0.3,'rewind'],[2.45,'flash'],[2.6,'appear'],[7.5,'scrape'],[10.6,'vanish'],[BUMP,'bump'],[21.0,'bell'],

const every=(a,b,dt,name)=>{for(let x=a;x<b;x+=dt) EV.push([x,name])};
every(6.3,7.4,0.4,'step'); every(12.4,17.6,0.42,'step'); every(18.2,20.7,0.42,'step'); every(21.65,22.1,0.22,'step');
every(0.4,2.6,0.11,'tick'); every(7.5,9.5,0.2,'tick'); every(13.5,15.1,0.14,'tick'); every(47.4,49.4,0.2,'tick');
for(let x=30.8;x<37.2;x+=0.35-0.29*livesK(x)) EV.push([x,'tick']);
for(let x=45.3,gap=0.85;x<47.6;x+=gap,gap+=0.12) EV.push([x,'heart']);
EV.sort((a,b)=>a[0]-b[0]);
function fire(e){Array.isArray(e)?SFX[e[0]](e[1]):SFX[e]()}
function audioTick(t,si){
  if(!AU.ctx) return;
  const c=AU.ctx;
  if(!AU.on||!playing){if(c.state==='running') c.suspend();AU.lastT=t;return}
  if(c.state==='suspended') c.resume();
  const last=AU.lastT; AU.lastT=t;
  if(last!==null){
    const wrapped=t<last&&last>DUR-0.6;
    if((t>last&&t-last<0.3)||wrapped){const from=wrapped?-1:last;for(const e of EV) if(e[0]>from&&e[0]<=t) fire(e[1])}
  }
  const now=c.currentTime;
  if(si!==AU.lastSi){AU.lastSi=si;CHORDS[si].forEach((m,i)=>AU.voices[i].forEach(o=>o.frequency.setTargetAtTime(midiF(m),now,0.35)))}
  const duck=narrActive(t)?0.45:1;
  AU.padG.gain.setTargetAtTime((si===8?0.3*(1-sm((t-56)/2)):0.24)*duck,now,0.3);
  AU.padF.frequency.setTargetAtTime(si===6?1500:si===5?500+900*livesK(t):si===8?450:700,now,0.3);
  let rl=0;
  if(si===3) rl=t<21?0.5*(1-clamp01((t-18)/3))+0.12:t<22.6?0.06:0.3;
  else if(si===4) rl=0.3*Math.max(0,1-(t-24)/3);
  AU.rumble.g.gain.setTargetAtTime(rl,now,0.15); AU.rumble.f.frequency.setTargetAtTime(70+200*rl,now,0.15);
  AU.wind.g.gain.setTargetAtTime(si===3||si===4?0.04:si===5||si===6?0.07:si===8?0.05:0,now,0.4);
  const lk=si===5?livesK(t):0;
  AU.riser.g.gain.setTargetAtTime(0.12*Math.pow(lk,1.5),now,0.1); AU.riser.f.frequency.setTargetAtTime(300+3000*lk,now,0.1);
  AU.riserOscG.gain.setTargetAtTime(0.025*lk,now,0.1); AU.riserOsc.frequency.setTargetAtTime(110*Math.pow(2,2*lk),now,0.1);
}
function setSound(on){
  if(!AU.ctx) initAudio();
  AU.on=on; AU.lastT=t;
  AU.master.gain.setTargetAtTime(on?0.85:0,AU.ctx.currentTime,0.05);
  if(on){AU.ctx.resume(); if(!playing){playing=true;syncBtn()}}
  sndBtn.textContent=on?'Sound on':'Sound off'; sndBtn.setAttribute('aria-pressed',on);
  $('hint').hidden=on;
  if(!on) hush();
}

/* ---------- narration: one take in the Desmond voice, cut into phrases and placed on the timeline ---------- */
const PHRASES=[ // [line, start in the take, end in the take, words]
  [0,0.51,3.04,'You go back exactly one hundred years.'],
  [0,3.70,5.01,'To 1925.'],
  [1,6.00,7.38,'You do one tiny thing.'],
  [1,8.19,10.67,'You slide a chair thirty centimeters.'],
  [1,11.45,12.28,'Then you leave.'],
  [2,13.36,15.57,'The next morning, a man walks through.'],
  [2,16.17,16.94,'He doesn’t trip.'],
  [2,17.58,19.22,'He saves four seconds.'],
  [3,19.93,21.32,'Four seconds is enough.'],
  [3,22.22,25.30,'He catches the 8:15 tram he always used to miss.'],
  [4,26.27,28.18,'So he never takes the later tram,'],
  [4,28.81,30.66,'where he would have met your great-grandmother.'],
  [5,31.84,33.35,'Their children are different people.'],
  [5,33.92,35.63,'So are their children’s children.'],
  [5,36.46,39.13,'The ripple spreads through every family it touches.'],
  [6,40.12,42.48,'By 2025, the cities are different,'],
  [6,43.10,44.40,'the inventions are different,'],
  [6,44.94,47.56,'and almost everyone alive is someone else.'],
  [7,48.48,50.36,'Your great-grandparents never met.'],
  [7,51.19,52.44,'So you were never born.'],
  [8,53.46,55.07,'All because of one chair.'],
  [9,55.99,57.40,'Would you still be here?']
];
const LINE_T=[0.3,6.2,12.3,18.2,24.2,30.3,38.2,45.3,51.7,55.0];
const SEGS=[];
{
  let cur=0, line=-1;
  for(const [l,s,e,text] of PHRASES){
    if(l!==line){line=l;cur=LINE_T[l]}
    const src0=Math.max(0,s-0.05), d=e+0.08-src0, words=text.split(' ');
    const chars=words.map(w=>w.length+1), tot=chars.reduce((a,b)=>a+b,0);
    let acc=0; const wt=chars.map(c=>{const v=cur+0.05+(acc/tot)*(d-0.13);acc+=c;return v});
    SEGS.push({T0:cur,T1:cur+d,src0,d,words,wt});
    cur+=d+0.22;
  }
}
let narrBuf=null, narrLoading=false, narrSrcs=[], narrLast=null;
function loadNarration(){
  if(narrBuf||narrLoading||!window.NARRATION_MP3) return;
  narrLoading=true;
  AU.narrG=AU.ctx.createGain(); AU.narrG.gain.value=1.1; AU.narrG.connect(AU.master);
  const bin=atob(window.NARRATION_MP3), u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  AU.ctx.decodeAudioData(u8.buffer,b=>{narrBuf=b;narrLast=null},()=>{narrLoading=false});
}
function hush(){narrSrcs.forEach(s=>{try{s.stop()}catch(e){}});narrSrcs=[]}
function scheduleNarration(t){
  hush(); if(!narrBuf) return;
  const now=AU.ctx.currentTime+0.02;
  for(const g of SEGS){
    if(g.T1<=t) continue;
    const into=Math.max(0,t-g.T0), s=AU.ctx.createBufferSource();
    s.buffer=narrBuf; s.connect(AU.narrG);
    s.start(now+Math.max(0,g.T0-t),g.src0+into,g.d-into);
    narrSrcs.push(s);
  }
}
const narrActive=t=>!!narrBuf&&SEGS.some(g=>t>=g.T0&&t<g.T1);
function narrTick(t){
  if(!AU.ctx) return;
  if(!AU.on||!playing){if(narrSrcs.length) hush();narrLast=null;return}
  loadNarration();
  const last=narrLast; narrLast=t;
  if(narrBuf&&!(last!==null&&t>=last&&t-last<0.3)) scheduleNarration(t);
}
const capEl=$('caption'); let capKey='';
function captionTick(t){
  let html='', key='';
  const g=t<51&&SEGS.find(g=>t>=g.T0&&t<g.T1+0.3);
  if(g){
    let wi=0; while(wi<g.words.length-1&&g.wt[wi+1]<=t) wi++;
    const c0=Math.floor(wi/3)*3;
    key=g.T0+':'+wi;
    html=g.words.slice(c0,c0+3).map((w,i)=>c0+i===wi?'<span class="on">'+w+'</span>':w).join(' ');
  }
  if(key!==capKey){capKey=key;capEl.innerHTML=html}
}

/* ---------- sizing and playback ---------- */
function fit(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  let h=vh, w=h*9/16; if(w>vw){w=vw;h=w*16/9}
  W=Math.max(1,Math.floor(w)); H=Math.max(1,Math.floor(h));
  stage.style.width=W+'px'; stage.style.height=H+'px'; controls.style.width=W+'px';
  renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(viewport); fit();

const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0, playing=!reduce, last=performance.now();
const playBtn=$('play'), scrub=$('scrub'), clock=$('clock');
const mmss=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
function syncBtn(){playBtn.textContent=playing?'Pause':'Play'}
playBtn.addEventListener('click',()=>{playing=!playing;if(playing&&t>=DUR-0.01)t=0;syncBtn()});
scrub.addEventListener('input',()=>{t=parseFloat(scrub.value)||0});
const sndBtn=$('snd');
sndBtn.addEventListener('click',()=>setSound(!AU.on));
$('hint').addEventListener('click',()=>setSound(true));
syncBtn();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing){t+=dt; if(t>=DUR) t=0}
  const r=update(t);
  renderer.render(scene,camera);
  overlay(t,r.si,r.s);
  audioTick(t,r.si);
  narrTick(t);
  captionTick(t);
  if(document.activeElement!==scrub) scrub.value=t.toFixed(2);
  setText(clock,mmss(t)+' / '+mmss(DUR));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
