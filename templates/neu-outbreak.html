/* Layout: one 9:16 film frame on a dark ground; every caption is drawn into the frame itself so the page and the exported video match */
:root{

  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);box-sizing:border-box;font-family:var(--mono);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.player{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.viewport{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#view{display:block;border-radius:8px;background:#000;width:270px;height:480px}
.controls{display:flex;align-items:center;gap:8px;width:270px;max-width:100%}
.controls button{flex:none;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);
  background:transparent;border:1px solid var(--rule);border-radius:4px;padding:8px 10px;cursor:pointer}
.controls button:hover{border-color:var(--dim)}
.controls button[aria-pressed="true"]{border-color:var(--rot);color:var(--rot)}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--rot);outline-offset:2px}
.controls input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--rot)}
.clock{flex:none;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.export .controls{display:none}
</style>

  </div>

</div>

function txt(s,x,y,font,color,o={}){

function richLines(tokens,font,maxW){
  g2.font=font; const words=[]; tokens.forEach(([s,c])=>s.split(' ').forEach(w=>w&&words.push([w,c])));
  const sp=g2.measureText(' ').width, lines=[[]]; let w=0;

  return {lines,sp};
}
function wrapText(s,font,maxW){

  for(const w of s.split(' ')){const tr=cur?cur+' '+w:w; if(g2.measureText(tr).width>maxW&&cur){out.push(cur);cur=w}else cur=tr}
  if(cur) out.push(cur); return out;
}

/* ---------- soundtrack: synthesized offline once, then played in sync with the timeline ---------- */

  const keys=(param,ks)=>{param.setValueAtTime(ks[0][1],0);ks.forEach(([t,v])=>param.linearRampToValueAtTime(v,t))};

    if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t0+dur);const g=c.createGain();env(g,t0,o.a||0.005,o.g||0.2,dur);s.connect(f);f.connect(g);out(g,o.wet!==false);s.start(t0);s.stop(t0+dur+0.05)}

  // drone: a dark chord that shifts each scene and swells with the panic
  const ROOT=[38,38,37,34,33,38,41,38,26], dF=c.createBiquadFilter(); dF.type='lowpass'; const dG=c.createGain(); dF.connect(dG); out(dG);
  keys(dG.gain,[[0,0],[1,0.05],[6.8,0.07],[14,0.08],[21,0.1],[29,0.09],[36,0.06],[43,0.07],[50,0.08],[52.8,0.05],[55,0.12],[59.8,0]]);
  keys(dF.frequency,[[0,500],[14,900],[21,1400],[29,900],[36,600],[43,700],[55,420],[60,300]]);
  [0,7,15].forEach((iv,vi)=>[-8,8].forEach(det=>{const o=c.createOscillator();o.type=vi?'sawtooth':'triangle';o.detune.value=det;
    SC.forEach((s,k)=>o.frequency.setTargetAtTime(mf(ROOT[k]+iv),Math.max(0,s.t0-0.05),0.3));const g=c.createGain();g.gain.value=vi?0.3:0.6;o.connect(g);g.connect(dF);o.start(0)}));

  keys(hl.g.gain,[[0,0],[43,0],[48,0.5],[50,0.55],[51.8,0.6],[52.79,0.55],[52.8,0.3],[55,0.25],[56.5,0],[60,0]]);
  keys(hl.f.frequency,[[0,800],[43,500],[50,900],[52.79,1000],[52.8,320],[55,320],[56,600]]);
  // pulses: heartbeat-like kicks that speed up with the chase
  const kick=(t0,g)=>tone(t0,120,0.28,{glide:42,g,wet:false});
  [[9,14,100,0.3],[14,21,140,0.4],[21,29,120,0.35],[29,36,110,0.3],[43,50,90,0.25],[50,52.8,120,0.3]].forEach(([a,b,bpm,g])=>{for(let x=a;x<b;x+=60/bpm) kick(x,g)});

  const stab=(t0,root,g)=>[0,1,6].forEach(iv=>tone(t0,mf(root+iv),1.4,{type:'sawtooth',g,a:0.02,lp:2400}));
  [[9.0,62,0.05],[21.0,57,0.06],[31.8,55,0.06],[54.0,74,0.05]].forEach(([x,r,g])=>stab(x,r,g));
  [5.0,11.2,18.8,19.6].forEach(x=>{tone(x,90,0.6,{glide:35,g:0.6,wet:false});nz(x,0.35,{type:'highpass',f0:3200,g:0.1});stab(x,50,0.035)});
  for(let x=14.2;x<20.6;x+=0.11+R()*0.05){nz(x,0.06,{f0:500+R()*300,q:1.2,g:0.06+R()*0.06,wet:false});tone(x,90,0.07,{g:0.08,wet:false})}
  [10.05,10.3,10.55,36.6,37.2,37.9].forEach(x=>{const s=c.createBufferSource();s.buffer=nb;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1000;f.Q.value=4;
    const g=c.createGain();g.gain.value=0.06;const l=c.createOscillator();l.frequency.value=12;const lg2=c.createGain();lg2.gain.value=0.06;l.connect(lg2);lg2.connect(g.gain);
    const e=c.createGain();env(e,x,0.1,1,x<20?0.5:1.1);s.connect(f);f.connect(g);g.connect(e);out(e,false);s.start(x);l.start(x);s.stop(x+1.2);l.stop(x+1.2)});
  nz(30,1.8,{type:'lowpass',f0:200,g:0.14,a:0.3,wet:false});
  [220,349,587,1043,1530,2210].forEach((f,i)=>tone(31.8,f,1.6,{g:0.09/(i+1)}));nz(31.8,0.2,{type:'highpass',f0:2500,g:0.15});
  THUDS.forEach(x=>{tone(x,68,0.32,{glide:40,g:0.55,wet:false});nz(x,0.2,{type:'lowpass',f0:400,g:0.3,wet:false})});
  tone(44.0,3000,0.02,{g:0.08,wet:false});
  nz(53.1,1.0,{type:'highpass',f0:1500,f1:6000,g:0.12,a:0.9});
  tone(55.2,55,3.2,{glide:28,g:0.8});

function wavBytes(buf){
  const ch=buf.numberOfChannels,n=buf.length,sr=buf.sampleRate,dv=new DataView(new ArrayBuffer(44+n*ch*2));

  ws(0,'RIFF');dv.setUint32(4,36+n*ch*2,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,ch,true);
  dv.setUint32(24,sr,true);dv.setUint32(28,sr*ch*2,true);dv.setUint16(32,ch*2,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*ch*2,true);
  const d=[...Array(ch)].map((_,k)=>buf.getChannelData(k));let o=44;
  for(let i=0;i<n;i++)for(let k=0;k<ch;k++){const v=Math.max(-1,Math.min(1,d[k][i]));dv.setInt16(o,v<0?v*0x8000:v*0x7fff,true);o+=2}

/* ---------- live playback ---------- */
const viewport=$('viewport'), controls=document.querySelector('.controls');
function fit(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight; let h=vh, w=h*9/16; if(w>vw){w=vw;h=w*16/9}
  w=Math.max(1,Math.floor(w)); h=Math.max(1,Math.floor(h)); const dpr=Math.min(window.devicePixelRatio||1,2);
  view.style.width=w+'px'; view.style.height=h+'px'; controls.style.width=w+'px';
  view.width=Math.round(w*dpr); view.height=Math.round(h*dpr);
  renderer.setPixelRatio(1); renderer.setSize(view.width,view.height,false); camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(fit).observe(viewport); fit();
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0, playing=!reduce, last=performance.now();
const playBtn=$('play'), sndBtn=$('snd'), scrub=$('scrub'), clock=$('clock');
const mmss=x=>Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0');
const syncBtn=()=>{playBtn.textContent=playing?'Pause':'Play'};
playBtn.addEventListener('click',()=>{playing=!playing;syncBtn()});
scrub.addEventListener('input',()=>{t=parseFloat(scrub.value)||0});
const S={on:false,ctx:null,buf:null,src:null,gain:null,lastT:null};
function stopSrc(){if(S.src){try{S.src.stop()}catch(e){}S.src=null}}
sndBtn.addEventListener('click',()=>{
  S.on=!S.on; sndBtn.setAttribute('aria-pressed',S.on);
  if(!S.on){stopSrc();sndBtn.textContent='Sound off';return}
  if(!S.ctx){S.ctx=new (window.AudioContext||window.webkitAudioContext)();S.gain=S.ctx.createGain();S.gain.connect(S.ctx.destination)}
  S.ctx.resume(); if(!playing){playing=true;syncBtn()}
  if(S.buf){sndBtn.textContent='Sound on';S.lastT=null;return}
  sndBtn.textContent='Loading…';
  buildScore().then(b=>{S.buf=b;S.lastT=null;if(S.on)sndBtn.textContent='Sound on'}).catch(()=>{sndBtn.textContent='No sound';S.on=false});
});
function soundTick(t){
  if(!S.on||!S.buf){return}
  if(!playing){stopSrc();S.lastT=null;return}
  if(!(S.src&&S.lastT!==null&&t>=S.lastT&&t-S.lastT<0.3)){
    stopSrc(); const s=S.ctx.createBufferSource(); s.buffer=S.buf; s.connect(S.gain); s.start(0,Math.min(t,DUR-0.01)); S.src=s;
  }
  S.lastT=t;
}
syncBtn();
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing){t+=dt;if(t>=DUR)t=0}
  drawFrame(t); soundTick(t);
  if(document.activeElement!==scrub) scrub.value=t.toFixed(2);
  const c=mmss(t); if(clock.textContent!==c) clock.textContent=c;
  requestAnimationFrame(frame);
}
fontsReady.finally(()=>requestAnimationFrame(frame));
})();
