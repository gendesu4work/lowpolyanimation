<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26306a"/>
      <stop offset="1" stop-color="#0b0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#6d7cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6d7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a5c"/>
      <stop offset="1" stop-color="#e2392f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- rounded-square tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <!-- faceted low-poly planet -->
  <g filter="url(#shadow)" stroke="#0b0f1f" stroke-width="5" stroke-linejoin="round">
    <polygon points="256,86 352,126 306,212" fill="#4f98f0"/>
    <polygon points="256,86 306,212 200,176" fill="#3a80d8"/>
    <polygon points="256,86 200,176 150,130" fill="#62a8ff"/>
    <polygon points="352,126 418,222 306,212" fill="#2f6dc0"/>
    <polygon points="150,130 200,176 98,226" fill="#4790e6"/>
    <polygon points="200,176 306,212 250,292" fill="#41b37a"/>
    <polygon points="200,176 250,292 140,312" fill="#349a66"/>
    <polygon points="306,212 418,222 382,322" fill="#3a7fd2"/>
    <polygon points="306,212 382,322 250,292" fill="#56c98a"/>
    <polygon points="98,226 200,176 140,312" fill="#2c66b0"/>
    <polygon points="98,226 140,312 112,372" fill="#21528f"/>
    <polygon points="140,312 250,292 216,412" fill="#2a63aa"/>
    <polygon points="250,292 382,322 322,422" fill="#2e6cb8"/>
    <polygon points="250,292 322,422 216,412" fill="#3a80d0"/>
    <polygon points="382,322 418,222 432,332" fill="#1d4a86"/>
    <polygon points="382,322 432,332 322,422" fill="#245a9a"/>
    <polygon points="112,372 140,312 216,412" fill="#1b467e"/>
    <polygon points="216,412 322,422 256,444" fill="#183e70"/>
    <polygon points="112,372 216,412 256,444" fill="#153866"/>
    <polygon points="322,422 432,332 256,444" fill="#163b6c"/>
  </g>
  <!-- play button -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="268" r="84" fill="url(#play)"/>
    <circle cx="256" cy="268" r="84" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="7"/>
    <path d="M235 226 Q229 222 229 230 L229 306 Q229 314 236 310 L300 274 Q307 268 300 262 Z" fill="#ffffff"/>
  </g>
</svg>
